<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AliExpress Callback</title>
  </head>
  <body style="font-family: system-ui; max-width: 32rem; margin: 4rem auto; padding: 0 1rem">
    <h1>Callback OK ✅</h1>
    <p>Esta página é apenas o <strong>Redirect URI</strong> do app AliExpress.</p>
    <p>Se um dia houver autorização OAuth, o <code>code</code> aparecerá abaixo:</p>
    <pre id="out" style="background:#f4f4f5; padding:1rem; border-radius:8px">(sem code na URL)</pre>
    <script>
      const code = new URLSearchParams(location.search).get('code');
      if (code) document.getElementById('out').textContent = 'code=' + code;
    </script>
  </body>
</html>
